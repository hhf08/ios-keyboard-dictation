name: KeyboardDictationDemo
options:
  bundleIdPrefix: net.stupidtech
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  KeyboardDictationDemo:
    type: application
    platform: iOS
    sources: [Sources/KeyboardDictationDemo, Sources/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.stupidtech.keyboard-dictation-demo
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: App.entitlements
    dependencies:
      - target: KeyboardDictationDemoKeyboard
        embed: true
  KeyboardDictationDemoKeyboard:
    type: app-extension
    platform: iOS
    sources: [Sources/KeyboardDictationDemoKeyboard, Sources/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.stupidtech.keyboard-dictation-demo.keyboard
        INFOPLIST_FILE: KeyboardInfo.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Keyboard.entitlements

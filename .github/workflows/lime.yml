name: Build LIME iOS (voice)
on:
  push:
    branches: [limeime-voice]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project LimeIME-iOS/LimeIME.xcodeproj -scheme LimeIME -sdk iphoneos -configuration Release \
            -derivedDataPath build -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build | tee build.log | grep -E "error:|warning: unable|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/*.app
      - name: Package IPA
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry LimeIME-voice-unsigned.ipa Payload
          ls -l LimeIME-voice-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lime-build
          path: |
            LimeIME-voice-unsigned.ipa
            build.log
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lime-${{ github.run_number }}
          name: LIME 语音版 ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: LimeIME-voice-unsigned.ipa
